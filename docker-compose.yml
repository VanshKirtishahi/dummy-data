services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7-jammy
    container_name: devagents-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: devagents
    volumes:
      - mongodb_data:/data/db
    networks:
      - devagents-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Express & Socket.IO Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devagents-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/devagents
      - JWT_SECRET=super_secret_devagents_key_change_me_in_production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - devagents-network

  # React Frontend Service (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devagents-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - backend
    networks:
      - devagents-network

# Persistent Volumes
volumes:
  mongodb_data:
    name: devagents-mongodb-data
    driver: local

# Isolated Bridge Network
networks:
  devagents-network:
    name: devagents-network
    driver: bridge
